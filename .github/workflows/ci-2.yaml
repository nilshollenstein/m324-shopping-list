name: Github Action 2

on:
  push:
    branches:
      - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
              node-version: 24
              cache: npm

          - name: Install dependencies
            run: npm ci

          - name: Lint Project
            run: npm run lint

          - name: Jest Test
            run: npm test

          - name: Build Project
            run: npm run build